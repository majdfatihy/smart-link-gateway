<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - صانع الروابط</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #1e293b; color: white; padding: 50px 20px; text-align: center; }
        .dashboard { background: #334155; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #cbd5e1; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; font-family: 'Cairo'; font-size: 16px; box-sizing: border-box; }
        button { background: #3b82f6; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; font-family: 'Cairo';}
        button:hover { background: #2563eb; }
        .result-box { margin-top: 30px; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: none; margin-bottom: 10px; direction: ltr; font-family: monospace; resize: none;}
        .copy-btn { background: #10b981; }
        .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>🛠️ صانع الروابط المشفرة</h1>
        
        <div class="input-group">
            <label>رابط موقعك على GitHub:</label>
            <input type="text" id="baseUrl" placeholder="مثال: https://majed.github.io/" value="https://YOUR_USERNAME.github.io/">
        </div>

        <div class="input-group">
            <label>اسم الملف (سيظهر للزائر):</label>
            <input type="text" id="fileName" placeholder="مثال: برنامج فوتوشوب 2026">
        </div>

        <div class="input-group">
            <label>رابط التحميل الأصلي (الوجهة النهائية):</label>
            <input type="url" id="targetUrl" placeholder="مثال: https://mediafire.com/file/123...">
        </div>

        <button onclick="generateLink()">إنشاء الرابط السري ⚡</button>

        <div class="result-box">
            <label>الرابط الجاهز للنشر:</label>
            <textarea id="resultUrl" readonly placeholder="سيظهر الرابط هنا..."></textarea>
            <button class="copy-btn" onclick="copyLink()">نسخ الرابط 📋</button>
        </div>
    </div>

    <script>
        function generateLink() {
            let baseUrl = document.getElementById('baseUrl').value.trim();
            const fileName = document.getElementById('fileName').value.trim();
            const targetUrl = document.getElementById('targetUrl').value.trim();

            if(!baseUrl || !fileName || !targetUrl) {
                alert("يرجى ملء جميع الحقول!");
                return;
            }

            // التأكد من عدم وجود سلاش (/) زائدة في نهاية رابط غيت هاب
            if(baseUrl.endsWith('/')) {
                baseUrl = baseUrl.slice(0, -1);
            }

            // تشفير الرابط الوجهة بـ Base64
            const encodedTarget = btoa(targetUrl);
            
            // ترميز اسم الملف ليكون آمناً في الروابط
            const encodedName = encodeURIComponent(fileName);

            // تجميع الرابط النهائي
            const finalLink = `${baseUrl}/?title=${encodedName}&link=${encodedTarget}`;
            
            document.getElementById('resultUrl').value = finalLink;
        }

        function copyLink() {
            const resultBox = document.getElementById('resultUrl');
            if(resultBox.value) {
                resultBox.select();
                document.execCommand('copy');
                alert("تم النسخ بنجاح! يمكنك نشره الآن.");
            }
        }
    </script>
</body>
</html>
