<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحضير الرابط...</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            margin: 20px 0;
        }
        h1 { color: #3b82f6; font-size: 26px; margin-bottom: 10px; font-weight: 900;}
        .file-name { font-size: 20px; color: #475569; margin-bottom: 30px; font-weight: 700; background: #f1f5f9; padding: 10px; border-radius: 8px;}
        .timer-box {
            font-size: 50px;
            font-weight: 900;
            color: #ef4444;
            margin: 30px 0;
        }
        .download-btn {
            display: none;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .download-btn:hover { background-color: #059669; transform: translateY(-3px); }
        .ad-space {
            width: 100%;
            max-width: 300px;
            min-height: 250px;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            border: 2px dashed #94a3b8;
            margin: 10px auto;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ضع كود إعلان البانر العلوي هنا -->
    <div class="ad-space" id="ad-top">مساحة إعلانية (300x250)</div>

    <div class="container">
        <h1>جاري تجهيز الرابط الآمن</h1>
        <div class="file-name" id="display-name">جاري جلب بيانات الملف...</div>
        
        <div class="timer-box" id="timer">15</div>
        
        <a href="#" class="download-btn" id="download-btn" rel="nofollow">اضغط هنا للانتقال للرابط</a>
    </div>

    <!-- ضع كود إعلان البانر السفلي هنا -->
    <div class="ad-space" id="ad-bottom">مساحة إعلانية (300x250)</div>

    <!-- كود التشغيل -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        // جلب اسم الملف وفك ترميز المسافات
        const pageTitle = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : 'الملف المطلوب';
        document.getElementById('display-name').textContent = 'الملف: ' + pageTitle;
        document.title = 'تحميل ' + pageTitle;

        // جلب الرابط وفك تشفير Base64
        const encodedLink = urlParams.get('link');
        let targetUrl = "#";
        try {
            targetUrl = encodedLink ? atob(encodedLink) : "#";
        } catch(e) {
            targetUrl = "#";
        }

        // إعداد العداد
        let timeLeft = 15; // يمكنك تغيير عدد الثواني من هنا
        const timerElement = document.getElementById('timer');
        const downloadBtn = document.getElementById('download-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.style.display = 'none';
                
                if(targetUrl !== "#") {
                    downloadBtn.href = targetUrl;
                    downloadBtn.style.display = 'inline-block';
                } else {
                    timerElement.style.display = 'block';
                    timerElement.textContent = "الرابط غير صحيح أو مفقود!";
                    timerElement.style.color = "#94a3b8";
                    timerElement.style.fontSize = "20px";
                }
            }
        }, 1000);
    </script>

    <!-- يمكنك وضع كود إعلانات البوب أندر (Pop-under) هنا قبل قفلة البودي -->
</body>
</html>
